name: Opportunity Aggregator

on:
  schedule:
    # 5 صباحًا بتوقيت مصر تقريبًا (UTC+2/+3 حسب التوقيت الصيفي) — الكرون
    # وقته دايمًا UTC، فده معناه حوالي 3:00 أو 4:00 صباحًا بتوقيت مصر.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      triggeredBy:
        description: "مين شغّل الـworkflow ده (اختياري، للّوجز بس)"
        required: false
        default: "manual"

# بيمنع تشغيلتين يشتغلوا في نفس الوقت (لو حد ضغط الزر وفي نفس اللحظة الكرون
# اشتغل) — يقفل السابقة لو لسه شغالة قبل ما يبدأ الجديدة.
concurrency:
  group: opportunity-aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aggregator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build (TypeScript → JS)
        run: npm run build

      - name: Run aggregator
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          TRIGGERED_BY: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'schedule' }}
        run: npm start
